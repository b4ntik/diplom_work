spring.datasource.url=jdbc:postgresql://localhost:5432/ads_service?sslmode=disable&useUnicode=true&characterEncoding=UTF-8&stringtype=unspecified
spring.datasource.username=diplom_user
spring.datasource.password=diplom_user
spring.datasource.driver-class-name=org.postgresql.Driver

#properties JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

#connection pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
app.file.upload-dir=./uploads
app.file.user-images-dir=${app.file.upload-dir}/users
app.file.ad-images-dir=${app.file.upload-dir}/ads
spring.web.resources.cache.period=3600
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.must-revalidate=true

# ????????? ???????? ??????
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

spring.servlet.multipart.location=${java.io.tmpdir}

# ??????? ???????????
logging.level.ru.skypro.homework=DEBUG
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.web.cors=DEBUG
logging.level.org.springframework.web.multipart=DEBUG
logging.org.apache.tomcat.util.http=DEBUG
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%t "%r" %s (%D ms)
